components:
  schemas:
    CanonicalVehicleCategory:
      title: Canonical Vehicle Category
      type: object
      properties:
        id: 
          title: id
          type: string
        authority:
          title: authority
          type: string
    CanonicalVehicle:
      title: CanonicalVehicle
      type: object
      properties:
        name: 
          title: Name
          type: string
        description:
          title: Description
          type: string
        code:
          title: Code
          type: string
          description: max length = 4
        json:
          $ref: '#/components/schemas/CanonicalVehicleDefinition'

    CanonicalVehicleDefinition:
      title: Canonical Vehicle Definition
      type: object
      properties:
        parkState: 
          title: parkState
          type: string
          enum:
              - i
              - p
              - k
              - j
              - x
          description: State of parked (i = In voorziening, j = j  In voorziening, juist gestald, k = In voorziening, neemt plek in, p = nabij voorziening, x = buiten voorziening). More info at https://docs.crow.nl/datastandaard-fietsparkeren/api-fiets/#enum-vehicleparkstate
        vehicle:
          $ref: '#/components/schemas/Vehicle'

    User:
      title: User
      required:
        - username
      type: object
      properties:
        username:
          title: Username
          type: string
        password:
          title: Password
          type: string
    UserPermissions:
      title: User permissions
      type: object
      properties:
        roles:
          title: username
          type: array
          items:
            description: role
            type: string
    Organisation:
      title: Organisation
      required:
        - name
      type: object
      properties:
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
    GeoRelation:
      title: GeoRelation
      enum:
        - intersects
        - within
      type: string
      description: An enumeration.
    SortingDirection:
      title: SortingDirection
      enum:
        - ASC
        - DESC
      type: string
      description: An enumeration.
    Survey:
      title: Survey
      required:
        - name
        - authority
        - license
      type: object
      properties:
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        authority:
          title: Authority
          type: string
        contractor:
          title: Contractor
          type: string
        license:
          title: License
          type: string
        distinguishesVehicleCategories:
          title: Distinguishesvehiclecategories
          type: string
    SurveyArea:
      title: SurveyArea
      required:
        - authority
      type: object
      properties:
        id:
          title: Id
          type: string
        localId:
          title: LocalId
          type: string
        name:
          title: Name
          type: string
        geoLocation:
          $ref: '#/components/schemas/GeoShape'
        parent:
          title: Parent
          type: string
        validFrom:
          title: Validfrom
          type: string
          format: date-time
        validThrough:
          title: Validthrough
          type: string
          format: date-time
        authority:
          title: Authority
          type: string
        xtraInfo:
          title: XtraInfo
          type: string
    ParkingLocation:
      title: ParkingLocation
      required:
        - authority
        - name
      type: object
      properties:
        id:
          title: Id
          type: string
        geoLocation:
          $ref: '#/components/schemas/GeoShape'
        validFrom:
          title: Validfrom
          type: string
          format: date-time
        validThrough:
          title: Validthrough
          type: string
          format: date-time
        authority:
          title: Authority
          type: string
        name:
          title: Name
          type: string
        localId:
          title: LocalId
          type: string
        allows:
          $ref: '#/components/schemas/Vehicle'
        features:
          title: SurveyAreaType
          uniqueItems: true
          type: array
          items:
            enum:
              - cameraSurveillance
              - lockerService
              - personnelSupervision
              - electronicAccess
              - indoor
              - surfaceParking
          default: []
    Section:
      title: Section
      required:
        - parkingLocation
        - authority
      type: object
      properties:
        id:
          title: Id
          type: string
        geoLocation:
          $ref: '#/components/schemas/GeoShape'
        parkingLocation:
          title: ParkingLocation
          type: string
        validFrom:
          title: Validfrom
          type: string
          format: date-time
        validThrough:
          title: Validthrough
          type: string
          format: date-time
        authority:
          title: Authority
          type: string
        name:
          title: Name
          type: string
        localId:
          title: LocalId
          type: string
        level:
          title: Level
          type: integer
        parkingSystemType:
          title: ParkingSystemType
          type: string
          description: r = rek, o = etagerek onder, b = etagerek boven, n = nietje, x = geen voorziening
    Vehicle:
      title: Vehicle
      properties:
        type:
          title: Type
          type: string
          enum:
            - f
            - c
            - s
            - b
            - m
            - g
            - a
          description: Vehicle definition (f = fiets, c = bakfiets, s = snorfiets, b = bromfiets, m = motorfiets, g = gehandicaptenvoertuig, a = anders)
    GeoShape:
      title: GeoShape
      properties:
        type:
          title: Type
          type: string
          enum:
            - MultiPolygon
            - Polygon
            - Point
          description: Type of shape
        coordinates:
          title: Coordinates
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
      example:
        coordinates:
          - - - - 4.459809327222
                - 51.540021027027
              - - 4.459936684027
                - 51.539941811035
              - - 4.459942559039
                - 51.539950459234
              - - 4.459809327222
                - 51.540021027027
            - - - 4.459809327222
                - 51.540021027027
              - - 4.459936684027
                - 51.539941811035
              - - 4.459942559039
                - 51.539950459234
              - - 4.459809327222
                - 51.540021027027
        type: MultiPolygon
      description: follow format as described in https://www.elastic.co/guide/en/elasticsearch/reference/current/shape.html
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
        - loc
        - msg
        - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            type: string
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
